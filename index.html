<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Simple Study Notes</title>
    <style>
        /* Base & Dark Glassmorphism Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0a1128, #1c2541, #0b132b);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        header h1 { color: #00f2fe; font-size: 1.8rem; margin-bottom: 5px; }
        header p { color: #a0aec0; font-size: 0.9rem; }

        .container { max-width: 1000px; margin: 0 auto; }

        /* SPA View Controls */
        .view { display: none; }
        .view.active { display: block; }

        /* Subject Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .card .icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        .card h3 { font-size: 1.3rem; }

        /* Subject View & Header */
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-back {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-back:hover { opacity: 0.8; transform: scale(1.05); }

        .search-box {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            outline: none;
            width: 100%;
            max-width: 300px;
        }

        /* Chapter Action Buttons */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-act {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.2s;
        }

        .btn-act.active:hover {
            background: #00f2fe;
            color: #000;
        }

        .btn-act.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 10px;
            float: right;
        }

        .available { background: rgba(0, 245, 212, 0.2); color: #00f5d4; }
        .empty { background: rgba(255, 99, 132, 0.2); color: #ff6384; }

        /* Modal Preview */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 800px; height: 80vh; display: flex; flex-direction: column; }
        .modal-header { padding: 10px 15px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <header class="glass container">
        <h1>📚 Study Notes</h1>
        <p>Simple & Quick Access Notes</p>
    </header>

    <div class="container">
        
        <!-- HOME VIEW (Folders) -->
        <div id="home-view" class="view active">
            <div class="grid">
                <div class="glass card" onclick="openSubject('hindi', '📙 Hindi')">
                    <span class="icon">📁</span>
                    <h3>Hindi</h3>
                </div>
                <div class="glass card" onclick="openSubject('english', '📘 English')">
                    <span class="icon">📁</span>
                    <h3>English</h3>
                </div>
                <div class="glass card" onclick="openSubject('chemistry', '🧪 Chemistry')">
                    <span class="icon">📁</span>
                    <h3>Chemistry</h3>
                </div>
                <div class="glass card" onclick="openSubject('biology', '🧬 Biology')">
                    <span class="icon">📁</span>
                    <h3>Biology</h3>
                </div>
                <div class="glass card" onclick="openSubject('physics', '⚡ Physics')">
                    <span class="icon">📁</span>
                    <h3>Physics</h3>
                </div>
                <div class="glass card" onclick="openSubject('physical_education', '🏃 Physical Education')">
                    <span class="icon">📁</span>
                    <h3>Physical Education</h3>
                </div>
            </div>
        </div>

        <!-- SUBJECT VIEW (Chapters) -->
        <div id="subject-view" class="view">
            <div class="sub-header">
                <button class="btn-back" onclick="goHome()">⬅ Back</button>
                <h2 id="subject-title">Subject</h2>
                <input type="text" id="search" class="search-box" placeholder="Search Chapter..." oninput="filterChapters()">
            </div>
            <div id="chapters-list" class="grid"></div>
        </div>

    </div>

    <!-- PDF Preview Modal -->
    <div id="modal" class="modal">
        <div class="glass modal-content">
            <div class="modal-header">
                <span id="modal-title">Preview</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <iframe id="pdf-frame" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>

           PASTE YOUR GOOGLE DRIVE LINKS HERE (Simple Ch 01 & Ch 02)
           ========================================================= */

                "Ch 05: Chapter 05": "",

                "Ch 09: Chapter 09": "",
                "Ch 10: Chapter 10": "",
                "Ch 11: Chapter 11": "",
                "Ch 12: Chapter 12": "",
                "Ch 13: Chapter 13": "",
                "Ch 14: Chapter 14": ""
            },
            english: {
                "Ch 01: Chapter 01": "",
                "Ch 02: Chapter 02": "",
                "Ch 03: Chapter 03": "",
                "Ch 04: Chapter 04": "",
                "Ch 05: Chapter 05": "",
                "Ch 06: Chapter 06": "",

                "Ch 10: Chapter 10": "",
                "Ch 11: Chapter 11": "",
                "Ch 12: Chapter 12": "",
                "Ch 13: Chapter 13": "",
                "Ch 14: Chapter 14": ""
            },
            chemistry: {
                "Ch 01: Chapter 01": "",
                "Ch 02: Chapter 02": "",
                "Ch 03: Chapter 03": "",
                "Ch 04: Chapter 04": "",
                "Ch 05: Chapter 05": "",
                "Ch 06: Chapter 06": "",
                "Ch 07: Chapter 07": "",
                "Ch 08: Chapter 08": "",
                "Ch 09: Chapter 09": "",
                "Ch 10: Chapter 10": "",
                "Ch 11: Chapter 11": "",
                "Ch 12: Chapter 12": "",
                "Ch 13: Chapter 13": "",
                "Ch 14: Chapter 14": ""
            },
            biology: {

                "Ch 02: Chapter 02": "",
                "Ch 03: Chapter 03": "",

                "Ch 14: Chapter 14": ""
            },
            physics: {
                "Ch 01: Chapter 01": "",

            },
            physical_education: {
                "Ch 01: Chapter 01": "https://drive.google.com/file/d/1xp7fGMtyCviAi4KJ2KhkyglQT6dJ3rB2/view?usp=drivesdk",
                "Ch 02: Chapter 02": "",

                "Ch 09: Chapter 09": "https://drive.google.com/file/d/19Y6j8DBxZyO3Cx4yf_GJkbUWs3gnTNqk/view?usp=drivesdk",
                "Ch 10: Chapter 10": "",
                "Ch 11: Chapter 11": "",
                "Ch 12: Chapter 12": "",
                "Ch 13: Chapter 13": "",
                "Ch 14: Chapter 14": ""
            }
        };

        let activeSubject = null;

        // Auto Extract Google Drive File ID
        function getDriveId(url) {
            if (!url) return null;
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        // Switch to Subject View
        function openSubject(key, title) {
            activeSubject = key;
            document.getElementById('subject-title').innerText = title;
            document.getElementById('search').value = '';
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('subject-view').classList.add('active');
            renderChapters();
        }

        // Switch to Home View
        function goHome() {
            document.getElementById('subject-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
        }

        // Render Chapter Cards
        function renderChapters() {
            const container = document.getElementById('chapters-list');
            container.innerHTML = '';
            const searchVal = document.getElementById('search').value.toLowerCase();
            const chapters = notes[activeSubject];

            if (!chapters) {
                container.innerHTML = '<p style="color: #ff6384;">Subject not found!</p>';
                return;
            }

            for (let name in chapters) {
                if (searchVal && !name.toLowerCase().includes(searchVal)) continue;

                const rawUrl = chapters[name];
                const fileId = getDriveId(rawUrl);
                const card = document.createElement('div');
                card.className = 'glass card';
                card.style.textAlign = 'left';

                if (fileId) {
                    const openUrl = `https://drive.google.com/file/d/${fileId}/view`;
                    const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
                    const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;

                    card.innerHTML = `
                        <div>
                            <span class="status-badge available">Available</span>
                            <h3>${name}</h3>
                        </div>
                        <div class="actions">
                            <a href="${openUrl}" target="_blank" class="btn-act active">Open</a>
                            <a href="${downloadUrl}" target="_blank" class="btn-act active">Download</a>
                            <button onclick="openModal('${previewUrl}', '${name}')" class="btn-act active">Preview</button>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div>
                            <span class="status-badge empty">Coming Soon</span>
                            <h3>${name}</h3>
                        </div>
                        <p style="font-size:0.8rem; color:#a0aec0; margin-top:8px;">📄 Notes Coming Soon</p>
                        <div class="actions">
                            <span class="btn-act disabled">Open</span>
                            <span class="btn-act disabled">Download</span>
                            <span class="btn-act disabled">Preview</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            }
        }

        function filterChapters() {
            renderChapters();
        }

        // Preview Modal Logic
        function openModal(url, title) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('pdf-frame').src = url;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('pdf-frame').src = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:900px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.2);
border-radius:24px;
padding:35px;
color:white;
box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h1{
font-size:38px;
margin-bottom:10px;
}

.subtitle{
opacity:.85;
margin-bottom:30px;
font-size:17px;
}

.info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:30px;
}

.box{
background:rgba(255,255,255,.1);
padding:18px;
border-radius:15px;
}

.box h3{
font-size:15px;
opacity:.8;
margin-bottom:6px;
}

.box p{
font-size:18px;
font-weight:bold;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:30px;
}

.btn{
flex:1;
min-width:180px;
padding:15px;
border-radius:12px;
text-align:center;
text-decoration:none;
font-size:18px;
font-weight:bold;
transition:.3s;
}

.open{
background:#22c55e;
color:white;
}

.download{
background:#2563eb;
color:white;
}

.btn:hover{
transform:translateY(-4px);
}

iframe{
width:100%;
height:600px;
border:none;
border-radius:18px;
background:white;
}

.footer{
margin-top:20px;
text-align:center;
opacity:.8;
font-size:14px;
}

@media(max-width:700px){

h1{
font-size:30px;
}

iframe{
height:420px;
}

}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📚 Study Notes</h1>

<p class="subtitle">
Quick access to your notes from anywhere.
</p>

<div class="info">

<div class="box">
<h3>Subject</h3>
<p>Notes</p>
</div>

<div class="box">
<h3>Format</h3>
<p>PDF</p>
</div>

<div class="box">
<h3>Access</h3>
<p>Online</p>
</div>

</div>

<div class="buttons">

<a class="btn open"
href="https://drive.google.com/file/d/1YlX3PF25ERJttA94_YjkBtO-IySw4E0h/view?usp=drivesdk"
target="_blank">
📖 Open PDF
</a>

<a class="btn download"
href="https://drive.google.com/uc?export=download&id=1YlX3PF25ERJttA94_YjkBtO-IySw4E0h">
⬇ Download PDF
</a>

</div>

<iframe
src="https://drive.google.com/file/d/1YlX3PF25ERJttA94_YjkBtO-IySw4E0h/preview"
allow="autoplay">
</iframe>

<div class="footer">
Made with ❤️ | Hosted on GitHub Pages
</div>

</div>

</div>

</body>
</html>
